name: ParaBank UI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: browser-actions/setup-chrome@v1

      - name: Run Cucumber suite (headless Chrome, excludes @known-defect)
        run: mvn -B -ntp clean test -Dheadless=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parabank-reports
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/cucumber.xml
            target/surefire-reports/

  # Scenarios that expose defects in the public ParaBank demo (see README).
  # They run on every push so a fix on Parasoft's side shows up here,
  # but they do not block the build.
  known-defects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Run @known-defect scenarios
        run: mvn -B -ntp clean test -Dheadless=true "-Dcucumber.filter.tags=@known-defect"
